owner = "pipery-dev"
action_name = "pipery-npm-ci"
title = "Pipery npm CI"
description = "CI pipeline for npm/Node.js: SAST, SCA, lint, build, test, versioning, packaging, publish, optional Docker image release, reintegration"
marketplace_category = "continuous-integration"
author = "pipery-dev"
action_type = "composite"
default_branch = "main"
version = "1.1.0"
repository_visibility = "public"
icon = "assets/icon.png"
test_command = ""
test_project_path = "test-project"
test_project_input = "project_path"
test_log_path = "pipery.jsonl"
test_log_success_values = ["success", "succeeded", "passed", "ok"]
cleanup_paths = ["pipery.jsonl"]

[[inputs]]
name = "project_path"
description = "Path to the project source tree the action should operate on."
required = false
default = "."

[[inputs]]
name = "config_file"
description = "Path to pipery config file."
required = false
default = ".pipery/config.yaml"

[[inputs]]
name = "node_version"
description = "Node.js version to use."
required = false
default = "20"

[[inputs]]
name = "package_manager"
description = "Package manager: auto, npm, yarn."
required = false
default = "auto"

[[inputs]]
name = "skip_sast"
description = "Skip SAST scan."
required = false
default = "false"

[[inputs]]
name = "skip_sca"
description = "Skip SCA scan."
required = false
default = "false"

[[inputs]]
name = "skip_lint"
description = "Skip lint step."
required = false
default = "false"

[[inputs]]
name = "strict_lint"
description = "Fail the action when lint reports errors."
required = false
default = "false"

[[inputs]]
name = "skip_build"
description = "Skip build step."
required = false
default = "false"

[[inputs]]
name = "tests_path"
description = "Path or glob passed to the test runner as an argument."
required = false
default = ""

[[inputs]]
name = "skip_test"
description = "Skip test step."
required = false
default = "false"

[[inputs]]
name = "skip_versioning"
description = "Skip versioning step."
required = false
default = "false"

[[inputs]]
name = "skip_packaging"
description = "Skip packaging step."
required = false
default = "false"

[[inputs]]
name = "skip_release"
description = "Skip npm release step."
required = false
default = "false"

[[inputs]]
name = "release_docker_image"
description = "Build and push a Docker image for the application after npm packaging/release."
required = false
default = "false"

[[inputs]]
name = "docker_registry"
description = "Docker registry host used for login and image prefix."
required = false
default = "ghcr.io"

[[inputs]]
name = "docker_image"
description = "Docker image name without tag. Defaults to the GitHub repository when available."
required = false
default = ""

[[inputs]]
name = "docker_tags"
description = "Comma, space, or newline separated Docker tags. Defaults to package version and sha-<short sha> when available."
required = false
default = ""

[[inputs]]
name = "docker_context"
description = "Docker build context, relative to project_path unless absolute."
required = false
default = "."

[[inputs]]
name = "dockerfile"
description = "Dockerfile path, relative to project_path unless absolute."
required = false
default = "Dockerfile"

[[inputs]]
name = "docker_username"
description = "Docker registry username. For ghcr.io this is usually the GitHub actor."
required = false
default = ""

[[inputs]]
name = "docker_password"
description = "Docker registry password or token."
required = false
default = ""

[[inputs]]
name = "docker_push_latest"
description = "Also tag and push latest."
required = false
default = "false"

[[inputs]]
name = "skip_reintegration"
description = "Skip reintegration step."
required = false
default = "false"

[[inputs]]
name = "version_bump"
description = "Version bump kind: patch, minor, major."
required = false
default = "patch"

[[inputs]]
name = "npm_token"
description = "npm registry auth token for publishing."
required = false
default = ""

[[inputs]]
name = "github_token"
description = "GitHub token for reintegration."
required = false
default = ""

[[inputs]]
name = "log_file"
description = "Path to the JSONL log file."
required = false
default = "pipery.jsonl"

[[inputs]]
name = "registry"
description = "npm registry target for release."
required = false
default = "npmjs"

[[test_log_required_fields]]
name = "event"
value = "build"
