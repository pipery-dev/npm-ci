# GitLab CI Pipeline for pipery-npm-ci
# This is the GitLab CI equivalent of the GitHub Actions npm-ci workflow
#
# SETUP INSTRUCTIONS:
# 1. Copy this file to your pipery-npm-ci repository as .gitlab-ci.yml
# 2. Update the variables section with your specific registry/credentials
# 3. Configure protected variables in GitLab CI/CD settings (Settings > CI/CD > Variables)
# 4. Set any skip_* variables to 'true' if you want to disable specific steps
#
# VARIABLES:
# These correspond to the GitHub Action inputs. Customize as needed.

variables:
  PROJECT_PATH: "."
  CONFIG_FILE: ".pipery/config.yaml"
  NODE_VERSION: "20"
  PACKAGE_MANAGER: "auto"
  TESTS_PATH: ""
  SKIP_SAST: "false"
  SKIP_SCA: "false"
  SKIP_LINT: "false"
  SKIP_BUILD: "false"
  SKIP_TEST: "false"
  SKIP_VERSIONING: "false"
  SKIP_PACKAGING: "false"
  SKIP_RELEASE: "false"
  SKIP_REINTEGRATION: "false"
  VERSION_BUMP: "patch"
  REGISTRY: "npmjs"
  NPM_TOKEN: ""
  GITHUB_TOKEN: ""
  LOG_FILE: "pipery.jsonl"
  TARGET_BRANCH: "main"

stages:
  - checkout
  - setup
  - sast
  - sca
  - lint
  - build
  - test
  - versioning
  - packaging
  - release
  - reintegration
  - logs

# ============================================================================
# CHECKOUT & SETUP STAGE
# ============================================================================

checkout:
  stage: checkout
  image: alpine:latest
  script:
    - echo "Repository already checked out by GitLab CI"
    - ls -la
  artifacts:
    paths:
      - .git/
    expire_in: 1 day

setup:
  stage: setup
  image: node:22-alpine
  before_script:
    - npm --version
    - node --version
  script:
    - echo "Setting up npm CI environment..."
    - cd $PROJECT_PATH
    - npm ci
    - echo "Setup complete"
  artifacts:
    paths:
      - $PROJECT_PATH/node_modules/
      - $PROJECT_PATH/package-lock.json
    expire_in: 1 day
  cache:
    paths:
      - $PROJECT_PATH/node_modules/

# ============================================================================
# SECURITY STAGES
# ============================================================================

sast_scan:
  stage: sast
  image: node:22-alpine
  script:
    # Refactored: Call shared script instead of inline logic
    - bash ./src/step-sast.sh
  env:
    INPUT_PROJECT_PATH: $PROJECT_PATH
    INPUT_LOG_FILE: $LOG_FILE
  allow_failure: true
  rules:
    - if: '$SKIP_SAST == "true"'
      when: never
    - when: on_success
  artifacts:
    paths:
      - $LOG_FILE
    expire_in: 30 days

sca_scan:
  stage: sca
  image: node:22-alpine
  script:
    # Refactored: Call shared script instead of inline logic
    - bash ./src/step-sca.sh
  env:
    INPUT_PROJECT_PATH: $PROJECT_PATH
    INPUT_LOG_FILE: $LOG_FILE
  allow_failure: true
  rules:
    - if: '$SKIP_SCA == "true"'
      when: never
    - when: on_success
  artifacts:
    paths:
      - $LOG_FILE
    expire_in: 30 days

# ============================================================================
# LINT STAGE
# ============================================================================

lint:
  stage: lint
  image: node:22-alpine
  script:
    # Refactored: Call shared script instead of inline logic
    - bash ./src/step-lint.sh
  env:
    INPUT_PROJECT_PATH: $PROJECT_PATH
    INPUT_LOG_FILE: $LOG_FILE
  rules:
    - if: '$SKIP_LINT == "true"'
      when: never
    - when: on_success
  allow_failure: true

# ============================================================================
# BUILD STAGE
# ============================================================================

build:
  stage: build
  image: node:22-alpine
  script:
    # Refactored: Call shared script instead of inline logic
    - bash ./src/step-build.sh
  env:
    INPUT_PROJECT_PATH: $PROJECT_PATH
    INPUT_PACKAGE_MANAGER: $PACKAGE_MANAGER
    INPUT_LOG_FILE: $LOG_FILE
  rules:
    - if: '$SKIP_BUILD == "true"'
      when: never
    - when: on_success
  artifacts:
    paths:
      - $PROJECT_PATH/dist/
      - $PROJECT_PATH/build/
    expire_in: 1 day

# ============================================================================
# TEST STAGE
# ============================================================================

test:
  stage: test
  image: node:22-alpine
  dependencies:
    - build
  script:
    # Refactored: Call shared script instead of inline logic
    - bash ./src/step-test.sh
  env:
    INPUT_PROJECT_PATH: $PROJECT_PATH
    INPUT_PACKAGE_MANAGER: $PACKAGE_MANAGER
    INPUT_TESTS_PATH: $TESTS_PATH
    INPUT_LOG_FILE: $LOG_FILE
  rules:
    - if: '$SKIP_TEST == "true"'
      when: never
    - when: on_success
  coverage: '/Coverage: \d+\.\d+%/'
  artifacts:
    paths:
      - $PROJECT_PATH/coverage/
    reports:
      junit: $PROJECT_PATH/coverage/junit.xml
    expire_in: 30 days

# ============================================================================
# VERSIONING STAGE
# ============================================================================

versioning:
  stage: versioning
  image: python:3.11-alpine
  script:
    # Refactored: Call shared script instead of inline logic
    - bash ./src/step-version.sh
  env:
    INPUT_PROJECT_PATH: $PROJECT_PATH
    INPUT_VERSION_BUMP: $VERSION_BUMP
    INPUT_LOG_FILE: $LOG_FILE
  rules:
    - if: '$SKIP_VERSIONING == "true"'
      when: never
    - when: on_success
  artifacts:
    paths:
      - version_info.txt
      - $LOG_FILE
    expire_in: 30 days

# ============================================================================
# PACKAGING STAGE
# ============================================================================

packaging:
  stage: packaging
  image: node:22-alpine
  dependencies:
    - build
    - versioning
  script:
    # Refactored: Call shared script instead of inline logic
    - bash ./src/step-package.sh
  env:
    INPUT_PROJECT_PATH: $PROJECT_PATH
    INPUT_LOG_FILE: $LOG_FILE
  rules:
    - if: '$SKIP_PACKAGING == "true"'
      when: never
    - when: on_success
  artifacts:
    paths:
      - $PROJECT_PATH/*.tgz
    expire_in: 30 days

# ============================================================================
# RELEASE STAGE
# ============================================================================

release:
  stage: release
  image: node:22-alpine
  dependencies:
    - versioning
    - packaging
  script:
    # Refactored: Call shared script instead of inline logic
    - bash ./src/step-release.sh
  env:
    INPUT_PROJECT_PATH: $PROJECT_PATH
    INPUT_NPM_TOKEN: $NPM_TOKEN
    INPUT_REGISTRY: $REGISTRY
    INPUT_LOG_FILE: $LOG_FILE
    GITHUB_SHA: $CI_COMMIT_SHA
  rules:
    - if: '$SKIP_RELEASE == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $TARGET_BRANCH'
      when: on_success
    - when: manual
  only:
    - branches

# ============================================================================
# REINTEGRATION STAGE
# ============================================================================

reintegration:
  stage: reintegration
  image: alpine:latest
  script:
    # Refactored: Call shared script instead of inline logic
    - bash ./src/step-reintegrate.sh
  env:
    INPUT_PROJECT_PATH: $PROJECT_PATH
    INPUT_LOG_FILE: $LOG_FILE
    INPUT_GITHUB_TOKEN: $GITHUB_TOKEN
    GITHUB_TOKEN: $GITHUB_TOKEN
  rules:
    - if: '$SKIP_REINTEGRATION == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == $TARGET_BRANCH'
      when: on_success
    - when: manual
  allow_failure: true

# ============================================================================
# ARTIFACTS & LOGGING
# ============================================================================

publish_logs:
  stage: logs
  image: alpine:latest
  script:
    - echo "Collecting logs and artifacts..."
    - |
      if [ -f "$LOG_FILE" ]; then
        echo "Log file size: $(wc -c < $LOG_FILE) bytes"
      fi
  artifacts:
    paths:
      - $LOG_FILE
      - version_info.txt
    expire_in: 90 days
  when: always
