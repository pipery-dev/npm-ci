# ============================================================================
# Bitbucket Pipelines Configuration for pipery-npm-ci
# Production-Ready Node.js/npm CI Pipeline
# ============================================================================
#
# SETUP INSTRUCTIONS:
# 1. Copy this file to pipery-npm-ci repository root as bitbucket-pipelines.yml
# 2. Configure Protected Variables in Bitbucket (Repo Settings > Pipelines > Repository Variables)
# 3. Set SKIP_* variables to 'true' to disable specific stages
# 4. Review and customize docker image versions as needed
#
# PROTECTED VARIABLES TO CONFIGURE:
# - REGISTRY_PASSWORD: Docker registry authentication token (Mark as Secured)
# - GITHUB_TOKEN: GitHub API token for reintegration (Mark as Secured)
# - PYPI_TOKEN: PyPI authentication token if needed (Mark as Secured)
#
# VARIABLE MAPPING:
# Variables correspond to GitHub Actions inputs for consistency.
# Customize in Bitbucket UI under Repository Variables.

# ============================================================================
# DEFINITIONS: Reusable script blocks and step templates
# ============================================================================

definitions:
  # --- Shared Step Templates ---
  steps:
    - step: &checkout-step
        name: Checkout Repository
        image: alpine:latest
        script:
          - echo "Repository checked out by Bitbucket Pipelines"
          - ls -la

    - step: &setup-step
        name: Setup npm Environment
        image: node:20-alpine
        caches:
          - node
        script:
          - echo "Setting up npm CI environment..."
          - node --version
          - npm --version
          - cd ${PROJECT_PATH:-.}
          - npm ci
          - echo "Setup complete"
        artifacts:
          - node_modules/**
          - package-lock.json

    - step: &sast-scan
        name: SAST Security Scan
        image: python:3.11-alpine
        script:
          # Refactored: Call shared script instead of inline logic
          - bash ./src/step-sast.sh
        env:
          INPUT_PROJECT_PATH: ${PROJECT_PATH:-.}
          INPUT_CONFIG_FILE: ${CONFIG_FILE:-.pipery/config.yaml}
          INPUT_LOG_FILE: ${LOG_FILE:-pipery.jsonl}
        artifacts:
          - ${LOG_FILE:-pipery.jsonl}

    - step: &sca-scan
        name: SCA Dependency Scan
        image: python:3.11-alpine
        script:
          # Refactored: Call shared script instead of inline logic
          - bash ./src/step-sca.sh
        env:
          INPUT_PROJECT_PATH: ${PROJECT_PATH:-.}
          INPUT_CONFIG_FILE: ${CONFIG_FILE:-.pipery/config.yaml}
          INPUT_LOG_FILE: ${LOG_FILE:-pipery.jsonl}
        artifacts:
          - ${LOG_FILE:-pipery.jsonl}

    - step: &lint-step
        name: Code Quality Linting
        image: node:20-alpine
        script:
          # Refactored: Call shared script instead of inline logic
          - bash ./src/step-lint.sh
        env:
          INPUT_PROJECT_PATH: ${PROJECT_PATH:-.}
          INPUT_LOG_FILE: ${LOG_FILE:-pipery.jsonl}

    - step: &build-step
        name: Build npm Package
        image: node:20-alpine
        caches:
          - node
        script:
          # Refactored: Call shared script instead of inline logic
          - bash ./src/step-build.sh
        env:
          INPUT_PROJECT_PATH: ${PROJECT_PATH:-.}
          INPUT_PACKAGE_MANAGER: ${PACKAGE_MANAGER:-auto}
          INPUT_LOG_FILE: ${LOG_FILE:-pipery.jsonl}
        artifacts:
          - dist/**
          - build/**

    - step: &test-step
        name: Execute Unit Tests
        image: node:20-alpine
        caches:
          - node
        script:
          # Refactored: Call shared script instead of inline logic
          - bash ./src/step-test.sh
        env:
          INPUT_PROJECT_PATH: ${PROJECT_PATH:-.}
          INPUT_TESTS_PATH: ${TESTS_PATH:-}
          INPUT_LOG_FILE: ${LOG_FILE:-pipery.jsonl}
        artifacts:
          - coverage/**

    - step: &versioning-step
        name: Version Bump & Tag
        image: python:3.11-alpine
        script:
          # Refactored: Call shared script instead of inline logic
          - bash ./src/step-version.sh
        env:
          INPUT_PROJECT_PATH: ${PROJECT_PATH:-.}
          INPUT_VERSION_BUMP: ${VERSION_BUMP:-patch}
          INPUT_LOG_FILE: ${LOG_FILE:-pipery.jsonl}
        artifacts:
          - version_info.txt
          - ${LOG_FILE:-pipery.jsonl}

    - step: &packaging-step
        name: Create Package Archive
        image: node:20-alpine
        script:
          # Refactored: Call shared script instead of inline logic
          - bash ./src/step-package.sh
        env:
          INPUT_PROJECT_PATH: ${PROJECT_PATH:-.}
          INPUT_LOG_FILE: ${LOG_FILE:-pipery.jsonl}
        artifacts:
          - "*.tgz"

    - step: &release-step
        name: Release to Registry
        image: node:20-alpine
        trigger: manual
        script:
          # Refactored: Call shared script instead of inline logic
          - bash ./src/step-release.sh
        env:
          INPUT_PROJECT_PATH: ${PROJECT_PATH:-.}
          INPUT_NPM_TOKEN: ${REGISTRY_PASSWORD:-}
          INPUT_REGISTRY: ${REGISTRY:-npmjs}
          INPUT_LOG_FILE: ${LOG_FILE:-pipery.jsonl}

    - step: &reintegration-step
        name: Reintegration to Target Branch
        image: alpine:latest
        trigger: manual
        script:
          # Refactored: Call shared script instead of inline logic
          - bash ./src/step-reintegrate.sh
        env:
          INPUT_PROJECT_PATH: ${PROJECT_PATH:-.}
          INPUT_LOG_FILE: ${LOG_FILE:-pipery.jsonl}
          INPUT_TARGET_BRANCH: ${TARGET_BRANCH:-main}
          GITHUB_TOKEN: ${GITHUB_TOKEN:-}

    - step: &logs-step
        name: Collect & Archive Logs
        image: alpine:latest
        script:
          - echo "Collecting logs and artifacts..."
          - |
            if [ -f "${LOG_FILE:-pipery.jsonl}" ]; then
              echo "Log file size: $(wc -c < ${LOG_FILE:-pipery.jsonl}) bytes"
            fi
        artifacts:
          - ${LOG_FILE:-pipery.jsonl}
          - version_info.txt

    - step: &dashboard-link
        name: Pipery Dashboard Link
        image: alpine:latest
        optional: true
        max-time: 5
        script:
          - echo "=================================================="
          - echo "Pipery Dashboard Link Generator"
          - echo "=================================================="
          - echo ""
          - # Construct artifact URL using Bitbucket's build endpoint
          - ARTIFACT_URL="https://bitbucket.org/${BITBUCKET_REPO_FULL_NAME}/pipelines/${BITBUCKET_BUILD_NUMBER}"
          - ""
          - # URL encode using Python (if available) or fall back to direct URL
          - ENCODED_ARTIFACT=$(python3 -c "import sys, urllib.parse; print(urllib.parse.quote('${ARTIFACT_URL}'))" 2>/dev/null || echo "${ARTIFACT_URL}")
          - ""
          - # Create dashboard URL
          - DASHBOARD_URL="https://dash.pipery.dev/?artifact=${ENCODED_ARTIFACT}"
          - ""
          - echo "Build Information:"
          - echo "  Repository: $BITBUCKET_REPO_FULL_NAME"
          - echo "  Build: $BITBUCKET_BUILD_NUMBER"
          - echo "  Branch: $BITBUCKET_BRANCH"
          - echo "  Commit: $BITBUCKET_COMMIT"
          - echo ""
          - echo "Artifact URL:"
          - echo "  $ARTIFACT_URL"
          - echo ""
          - echo "Dashboard Link:"
          - echo "[View in Pipery Dashboard]($DASHBOARD_URL)"
          - echo ""
          - |
            cat > dashboard-link.txt << 'DASHBOARD_EOF'
            # Pipery Dashboard Link

            Repository: $BITBUCKET_REPO_FULL_NAME
            Build: $BITBUCKET_BUILD_NUMBER
            Branch: $BITBUCKET_BRANCH
            Commit: $BITBUCKET_COMMIT
            Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)

            ## Dashboard
            [View in Pipery Dashboard]($DASHBOARD_URL)

            ## Direct Links
            - Bitbucket Build: https://bitbucket.org/${BITBUCKET_REPO_FULL_NAME}/pipelines/${BITBUCKET_BUILD_NUMBER}
            DASHBOARD_EOF
          - echo "Dashboard link info saved to dashboard-link.txt"
          - echo "=================================================="
        artifacts:
          - dashboard-link.txt


# ============================================================================
# PIPELINE VARIABLES
# Variables can be overridden in Bitbucket UI or via --variables flag
# ============================================================================

variables:
  # Build Configuration
  PROJECT_PATH: "."
  CONFIG_FILE: ".pipery/config.yaml"
  PACKAGE_MANAGER: "auto"

  # Feature Flags: Set to 'true' to skip specific stages
  SKIP_SAST: "false"
  SKIP_SCA: "false"
  SKIP_LINT: "false"
  SKIP_BUILD: "false"
  SKIP_TEST: "false"
  SKIP_VERSIONING: "false"
  SKIP_PACKAGING: "false"
  SKIP_RELEASE: "false"
  SKIP_REINTEGRATION: "false"

  # Release Configuration
  VERSION_BUMP: "patch"  # Options: major, minor, patch
  REGISTRY: "https://registry.npmjs.org"
  REGISTRY_USERNAME: ""

  # Note: REGISTRY_PASSWORD and GITHUB_TOKEN should be set as Protected Variables
  # in Bitbucket UI under Repository Settings > Pipelines > Repository Variables

  # Logging & Tracking
  LOG_FILE: "pipery.jsonl"
  TARGET_BRANCH: "main"

# ============================================================================
# PIPELINES: Execution flow definition
# ============================================================================

pipelines:

  # --- Default: Run on all branches ---
  default:
    - step: *checkout-step

    - step: *setup-step

    # Parallel security scanning
    - parallel:
        - step: *sast-scan
        - step: *sca-scan

    - step:
        <<: *lint-step
        condition:
          variable:
            - SKIP_LINT = "false"
        optional: true

    - step:
        <<: *build-step
        condition:
          variable:
            - SKIP_BUILD = "false"

    - step:
        <<: *test-step
        condition:
          variable:
            - SKIP_TEST = "false"
        optional: true

    - step:
        <<: *versioning-step
        condition:
          variable:
            - SKIP_VERSIONING = "false"

    - step:
        <<: *packaging-step
        condition:
          variable:
            - SKIP_PACKAGING = "false"

    - step: *logs-step
    - step: *dashboard-link

  # --- Branches: Main/production branch with release
  branches:
    main:
      - step: *checkout-step

      - step: *setup-step

      - parallel:
          - step: *sast-scan
          - step: *sca-scan

      - step:
          <<: *lint-step
          condition:
            variable:
              - SKIP_LINT = "false"
          optional: true

      - step:
          <<: *build-step
          condition:
            variable:
              - SKIP_BUILD = "false"

      - step:
          <<: *test-step
          condition:
            variable:
              - SKIP_TEST = "false"
          optional: true

      - step:
          <<: *versioning-step
          condition:
            variable:
              - SKIP_VERSIONING = "false"

      - step:
          <<: *packaging-step
          condition:
            variable:
              - SKIP_PACKAGING = "false"

      - step:
          <<: *release-step
          condition:
            variable:
              - SKIP_RELEASE = "false"

      - step:
          <<: *reintegration-step
          condition:
            variable:
              - SKIP_REINTEGRATION = "false"
          optional: true

      - step: *logs-step
      - step: *dashboard-link

  # --- Pull Requests: Enhanced checks for PRs ---
  pull-requests:
    feature/**:
      - step: *checkout-step

      - step: *setup-step

      - parallel:
          - step: *sast-scan
          - step: *sca-scan

      - step:
          <<: *lint-step
          condition:
            variable:
              - SKIP_LINT = "false"
          optional: true

      - step:
          <<: *build-step
          condition:
            variable:
              - SKIP_BUILD = "false"

      - step:
          <<: *test-step
          condition:
            variable:
              - SKIP_TEST = "false"
          optional: true

      - step: *logs-step
      - step: *dashboard-link

  # --- Manual Trigger: Full pipeline with all steps ---
  custom:
    release:
      - step: *checkout-step

      - step: *setup-step

      - parallel:
          - step: *sast-scan
          - step: *sca-scan

      - step:
          <<: *lint-step
          condition:
            variable:
              - SKIP_LINT = "false"
          optional: true

      - step:
          <<: *build-step
          condition:
            variable:
              - SKIP_BUILD = "false"

      - step:
          <<: *test-step
          condition:
            variable:
              - SKIP_TEST = "false"
          optional: true

      - step:
          <<: *versioning-step
          condition:
            variable:
              - SKIP_VERSIONING = "false"

      - step:
          <<: *packaging-step
          condition:
            variable:
              - SKIP_PACKAGING = "false"

      - step:
          <<: *release-step
          condition:
            variable:
              - SKIP_RELEASE = "false"

      - step:
          <<: *reintegration-step
          condition:
            variable:
              - SKIP_REINTEGRATION = "false"
          optional: true

      - step: *logs-step
      - step: *dashboard-link

# ============================================================================
# CONFIGURATION NOTES:
# ============================================================================
#
# Caching:
#   - Uses Bitbucket's built-in 'node' cache for node_modules/
#   - Speeds up subsequent builds by caching npm dependencies
#
# Artifacts:
#   - Build outputs (dist/, build/) preserved for downstream steps
#   - Test coverage and logs retained for 7 days by default
#   - Versioning info available as version_info.txt
#
# Security:
#   - Protected Variables stored encrypted in Bitbucket
#   - Secrets never appear in build logs
#   - SAST/SCA scans configured to be non-blocking (optional: true)
#
# Customization:
#   - Modify docker images to match your Node.js version requirements
#   - Adjust npm scripts in build/test steps to match package.json
#   - Configure artifact paths based on your project structure
#   - Parallel steps for SAST/SCA improve overall pipeline throughput
#
# ============================================================================
