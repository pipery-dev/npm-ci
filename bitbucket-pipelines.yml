# ============================================================================
# Bitbucket Pipelines Configuration for pipery-npm-ci
# Production-Ready Node.js/npm CI Pipeline
# ============================================================================
#
# SETUP INSTRUCTIONS:
# 1. Copy this file to pipery-npm-ci repository root as bitbucket-pipelines.yml
# 2. Configure Protected Variables in Bitbucket (Repo Settings > Pipelines > Repository Variables)
# 3. Set SKIP_* variables to 'true' to disable specific stages
# 4. Review and customize docker image versions as needed
#
# PROTECTED VARIABLES TO CONFIGURE:
# - REGISTRY_PASSWORD: Docker registry authentication token (Mark as Secured)
# - GITHUB_TOKEN: GitHub API token for reintegration (Mark as Secured)
# - PYPI_TOKEN: PyPI authentication token if needed (Mark as Secured)
#
# VARIABLE MAPPING:
# Variables correspond to GitHub Actions inputs for consistency.
# Customize in Bitbucket UI under Repository Variables.

# ============================================================================
# DEFINITIONS: Reusable script blocks and step templates
# ============================================================================

definitions:
  # --- Shared Step Templates ---
  steps:
    - step: &checkout-step
        name: Checkout Repository
        image: alpine:latest
        script:
          - echo "Repository checked out by Bitbucket Pipelines"
          - ls -la

    - step: &setup-step
        name: Setup npm Environment
        image: node:20-alpine
        caches:
          - node
        script:
          - echo "Setting up npm CI environment..."
          - node --version
          - npm --version
          - cd ${PROJECT_PATH:-.}
          - npm ci
          - echo "Setup complete"
        artifacts:
          - node_modules/**
          - package-lock.json

    - step: &sast-scan
        name: SAST Security Scan
        image: python:3.11-alpine
        script:
          - echo "Running SAST scan using pipery-tooling..."
          - pip install --quiet pipery-tooling
          - |
            pipery-tooling sast \
              --project-path ${PROJECT_PATH:-.} \
              --config ${CONFIG_FILE:-.pipery/config.yaml} \
              --log-file ${LOG_FILE:-pipery.jsonl}
          - echo "SAST scan complete"
        artifacts:
          - ${LOG_FILE:-pipery.jsonl}

    - step: &sca-scan
        name: SCA Dependency Scan
        image: python:3.11-alpine
        script:
          - echo "Running SCA scan using pipery-tooling..."
          - pip install --quiet pipery-tooling
          - |
            pipery-tooling sca \
              --project-path ${PROJECT_PATH:-.} \
              --config ${CONFIG_FILE:-.pipery/config.yaml} \
              --log-file ${LOG_FILE:-pipery.jsonl}
          - echo "SCA scan complete"
        artifacts:
          - ${LOG_FILE:-pipery.jsonl}

    - step: &lint-step
        name: Code Quality Linting
        image: node:20-alpine
        script:
          - echo "Running npm linters..."
          - cd ${PROJECT_PATH:-.}
          - npm run lint || true
          - echo "Lint stage complete"

    - step: &build-step
        name: Build npm Package
        image: node:20-alpine
        caches:
          - node
        script:
          - echo "Building npm package..."
          - cd ${PROJECT_PATH:-.}
          - npm run build
          - echo "Build complete"
        artifacts:
          - dist/**
          - build/**

    - step: &test-step
        name: Execute Unit Tests
        image: node:20-alpine
        caches:
          - node
        script:
          - echo "Running npm tests..."
          - cd ${PROJECT_PATH:-.}
          - npm test -- --coverage
          - echo "Tests complete"
        artifacts:
          - coverage/**

    - step: &versioning-step
        name: Version Bump & Tag
        image: python:3.11-alpine
        script:
          - echo "Running versioning step..."
          - pip install --quiet pipery-tooling
          - |
            pipery-tooling version \
              --project-path ${PROJECT_PATH:-.} \
              --version-bump ${VERSION_BUMP:-patch} \
              --log-file ${LOG_FILE:-pipery.jsonl}
          - |
            if [ -f "${PROJECT_PATH:-.}/package.json" ]; then
              grep '"version"' ${PROJECT_PATH:-.}/package.json | head -1 > version_info.txt
              cat version_info.txt
            fi
          - echo "Versioning complete"
        artifacts:
          - version_info.txt
          - ${LOG_FILE:-pipery.jsonl}

    - step: &packaging-step
        name: Create Package Archive
        image: node:20-alpine
        script:
          - echo "Creating npm package..."
          - cd ${PROJECT_PATH:-.}
          - npm pack
          - echo "Package created"
        artifacts:
          - "*.tgz"

    - step: &release-step
        name: Release to Registry
        image: node:20-alpine
        trigger: manual
        script:
          - echo "Publishing to npm registry..."
          - cd ${PROJECT_PATH:-.}
          - |
            if [ -n "$REGISTRY" ] && [ "$REGISTRY" != "npm" ]; then
              npm config set registry "$REGISTRY"
            fi
          - |
            if [ -n "$REGISTRY_PASSWORD" ]; then
              REGISTRY_HOST=$(echo $REGISTRY | sed 's|https://||')
              npm set //${REGISTRY_HOST}:_authToken=$REGISTRY_PASSWORD
            fi
          - npm publish
          - echo "Release complete"

    - step: &reintegration-step
        name: Reintegration to Target Branch
        image: alpine:latest
        trigger: manual
        script:
          - echo "Reintegration step would update target branch..."
          - |
            if [ -z "$GITHUB_TOKEN" ]; then
              echo "Skipping reintegration: GITHUB_TOKEN not set"
              exit 0
            fi
          - echo "Reintegration complete"

    - step: &logs-step
        name: Collect & Archive Logs
        image: alpine:latest
        script:
          - echo "Collecting logs and artifacts..."
          - |
            if [ -f "${LOG_FILE:-pipery.jsonl}" ]; then
              echo "Log file size: $(wc -c < ${LOG_FILE:-pipery.jsonl}) bytes"
            fi
        artifacts:
          - ${LOG_FILE:-pipery.jsonl}
          - version_info.txt

# ============================================================================
# PIPELINE VARIABLES
# Variables can be overridden in Bitbucket UI or via --variables flag
# ============================================================================

variables:
  # Build Configuration
  PROJECT_PATH: "."
  CONFIG_FILE: ".pipery/config.yaml"
  PACKAGE_MANAGER: "auto"

  # Feature Flags: Set to 'true' to skip specific stages
  SKIP_SAST: "false"
  SKIP_SCA: "false"
  SKIP_LINT: "false"
  SKIP_BUILD: "false"
  SKIP_TEST: "false"
  SKIP_VERSIONING: "false"
  SKIP_PACKAGING: "false"
  SKIP_RELEASE: "false"
  SKIP_REINTEGRATION: "false"

  # Release Configuration
  VERSION_BUMP: "patch"  # Options: major, minor, patch
  REGISTRY: "https://registry.npmjs.org"
  REGISTRY_USERNAME: ""

  # Note: REGISTRY_PASSWORD and GITHUB_TOKEN should be set as Protected Variables
  # in Bitbucket UI under Repository Settings > Pipelines > Repository Variables

  # Logging & Tracking
  LOG_FILE: "pipery.jsonl"
  TARGET_BRANCH: "main"

# ============================================================================
# PIPELINES: Execution flow definition
# ============================================================================

pipelines:

  # --- Default: Run on all branches ---
  default:
    - step: *checkout-step

    - step: *setup-step

    # Parallel security scanning
    - parallel:
        - step: *sast-scan
        - step: *sca-scan

    - step:
        <<: *lint-step
        condition:
          variable:
            - SKIP_LINT = "false"
        optional: true

    - step:
        <<: *build-step
        condition:
          variable:
            - SKIP_BUILD = "false"

    - step:
        <<: *test-step
        condition:
          variable:
            - SKIP_TEST = "false"
        optional: true

    - step:
        <<: *versioning-step
        condition:
          variable:
            - SKIP_VERSIONING = "false"

    - step:
        <<: *packaging-step
        condition:
          variable:
            - SKIP_PACKAGING = "false"

    - step: *logs-step

  # --- Branches: Main/production branch with release
  branches:
    main:
      - step: *checkout-step

      - step: *setup-step

      - parallel:
          - step: *sast-scan
          - step: *sca-scan

      - step:
          <<: *lint-step
          condition:
            variable:
              - SKIP_LINT = "false"
          optional: true

      - step:
          <<: *build-step
          condition:
            variable:
              - SKIP_BUILD = "false"

      - step:
          <<: *test-step
          condition:
            variable:
              - SKIP_TEST = "false"
          optional: true

      - step:
          <<: *versioning-step
          condition:
            variable:
              - SKIP_VERSIONING = "false"

      - step:
          <<: *packaging-step
          condition:
            variable:
              - SKIP_PACKAGING = "false"

      - step:
          <<: *release-step
          condition:
            variable:
              - SKIP_RELEASE = "false"

      - step:
          <<: *reintegration-step
          condition:
            variable:
              - SKIP_REINTEGRATION = "false"
          optional: true

      - step: *logs-step

  # --- Pull Requests: Enhanced checks for PRs ---
  pull-requests:
    feature/**:
      - step: *checkout-step

      - step: *setup-step

      - parallel:
          - step: *sast-scan
          - step: *sca-scan

      - step:
          <<: *lint-step
          condition:
            variable:
              - SKIP_LINT = "false"
          optional: true

      - step:
          <<: *build-step
          condition:
            variable:
              - SKIP_BUILD = "false"

      - step:
          <<: *test-step
          condition:
            variable:
              - SKIP_TEST = "false"
          optional: true

      - step: *logs-step

  # --- Manual Trigger: Full pipeline with all steps ---
  custom:
    release:
      - step: *checkout-step

      - step: *setup-step

      - parallel:
          - step: *sast-scan
          - step: *sca-scan

      - step:
          <<: *lint-step
          condition:
            variable:
              - SKIP_LINT = "false"
          optional: true

      - step:
          <<: *build-step
          condition:
            variable:
              - SKIP_BUILD = "false"

      - step:
          <<: *test-step
          condition:
            variable:
              - SKIP_TEST = "false"
          optional: true

      - step:
          <<: *versioning-step
          condition:
            variable:
              - SKIP_VERSIONING = "false"

      - step:
          <<: *packaging-step
          condition:
            variable:
              - SKIP_PACKAGING = "false"

      - step:
          <<: *release-step
          condition:
            variable:
              - SKIP_RELEASE = "false"

      - step:
          <<: *reintegration-step
          condition:
            variable:
              - SKIP_REINTEGRATION = "false"
          optional: true

      - step: *logs-step

# ============================================================================
# CONFIGURATION NOTES:
# ============================================================================
#
# Caching:
#   - Uses Bitbucket's built-in 'node' cache for node_modules/
#   - Speeds up subsequent builds by caching npm dependencies
#
# Artifacts:
#   - Build outputs (dist/, build/) preserved for downstream steps
#   - Test coverage and logs retained for 7 days by default
#   - Versioning info available as version_info.txt
#
# Security:
#   - Protected Variables stored encrypted in Bitbucket
#   - Secrets never appear in build logs
#   - SAST/SCA scans configured to be non-blocking (optional: true)
#
# Customization:
#   - Modify docker images to match your Node.js version requirements
#   - Adjust npm scripts in build/test steps to match package.json
#   - Configure artifact paths based on your project structure
#   - Parallel steps for SAST/SCA improve overall pipeline throughput
#
# ============================================================================
